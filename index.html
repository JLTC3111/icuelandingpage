<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <script>if(/^#\/./.test(location.hash)&&!/^#\/Home\/?$/.test(location.hash)){var u=new URL('https://vi.icue.vn/'+location.search+location.hash);try{var p=localStorage.getItem('icue-landing-theme');if((u.searchParams.get('theme')!=='light'&&u.searchParams.get('theme')!=='dark')&&(p==='light'||p==='dark'))u.searchParams.set('theme',p)}catch{}location.replace(u.href)}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f2" />
    <script>var t=new URLSearchParams(location.search).get('theme');if(t!=='dark'&&t!=='light'){try{t=localStorage.getItem('icue-landing-theme')}catch{}}if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;</script>
    <meta name="description" content="ICUE — Viện Nghiên cứu Kinh tế Xây dựng và Đô thị. Kết nối nghiên cứu, quy hoạch và cộng đồng để kiến tạo tương lai đô thị bền vững." />
    <link rel="icon" type="image/png" href="/media/original-logo.png" />
    <link rel="preload" href="/fonts/archivo-bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/archivo-regular.woff2" as="font" type="font/woff2" crossorigin />
    <title>ICUE — Kiến tạo tương lai đô thị</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
